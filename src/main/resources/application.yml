spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:stockwaifu;MODE=MySQL;NON_KEYWORDS=USER
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Springdoc 경로가 정적 리소스와 꼬이지 않도록 명시해 줍니다.
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    # 💡 'java' 대신 false를 주거나, 아예 이 라인을 지워버리면 에러가 깔끔하게 해결됩니다!
    enabled: true
